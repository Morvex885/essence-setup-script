[package]
name = "essence-rc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
crossterm.workspace = true
essence-rc-client.workspace = true
essence-rc-tui.workspace = true
essence-rc-web.workspace = true
hex.workspace = true
rand.workspace = true
rc-core.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_Pipes"] }

[dev-dependencies]
futures-util.workspace = true
proptest.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

# Process-level GitHub source scenarios. Without the libtest harness the test
# binary doubles as the fake `gh` placed first on PATH (see the file header).
[[test]]
name = "github_source"
harness = false
