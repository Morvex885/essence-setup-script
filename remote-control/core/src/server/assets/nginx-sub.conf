# Essence site essence-sub
server {
{{listen}}
    server_name {{hostname}};

    ssl_certificate     /etc/nginx/ssl/{{hostname}}/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/{{hostname}}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    include /etc/nginx/snippets/essence-sub/sub-*.conf;

    location ~ "^/sub/([a-f0-9]{64})$" {
        alias {{sub_dir}}/$1.yaml;
        default_type application/yaml;
        limit_req zone=sub burst=5 nodelay;
    }

    location / {
        return 444;
    }
}
