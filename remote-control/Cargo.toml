[workspace]
members = ["core", "client", "bin", "tui", "web"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
age = "0.11"
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "5"
hex = "0.4"
include_dir = "0.7"
libc = "0.2"
proptest = "1"
rand = "0.8"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"] }
rc-core = { path = "core" }
essence-rc-tui = { path = "tui" }
essence-rc-client = { path = "client" }
essence-rc-web = { path = "web" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "fs", "process", "signal", "sync", "time"] }
zeroize = { version = "1", features = ["derive", "serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
semver = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }
