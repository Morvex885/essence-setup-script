# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ru-RU
reviews:
  profile: chill
  request_changes_workflow: true
  path_filters:
    - "!tests/lib/**"
  auto_review:
    enabled: true
    base_branches:
      - "^develop$"
  path_instructions:
    - path: "{.github/workflows/**,tests/ci/build_release_tarball.sh}"
      instructions: |
        - Релизный архив серверного комплекта собирает и проверяет tests/ci/build_release_tarball.sh (release.yml и tests.yml для PR в main): архив обязан содержать все tracked-файлы из common/, setup-essence/ и VERSION (их требуют проверки `_need` в setup-essence/install-essence.sh) и не содержать remote-control/ (Cargo workspace клиента: исходники Rust, встроенные шаблоны). Клиент выходит бинарниками `essence-rc-<target>.tar.gz|.zip` + `SHA256SUMS` (job `build` в release.yml), их ставит install-essence-rc.sh.
        - Job id `test` в tests.yml — обязательная проверка в rulesets protect-main и protect-develop; переименование блокирует мерж.
        - Минимальные permissions GITHUB_TOKEN; `contents: write` только у job публикации релиза.
        - Не подставлять `${{ }}`-выражения прямо в `run:`; передавать через `env:`.
    - path: "**/install-*.sh"
      instructions: |
        - Список `_need` должен соответствовать содержимому архива из tests/ci/build_release_tarball.sh; новый обязательный файл — проверить, что скрипт его упаковывает.
    - path: "**/*.sh"
      instructions: |
        - Все entrypoints поддерживают Bash 3.2 (системный bash macOS): без mapfile/readarray, `declare -A`, `${var,,}`/`${var^^}`, `&>>`, `|&`, отрицательных индексов массивов.
