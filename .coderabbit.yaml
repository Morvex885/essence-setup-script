# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ru-RU
reviews:
  profile: chill
  request_changes_workflow: true
  path_filters:
    - "!tests/lib/**"
  auto_review:
    enabled: true
    base_branches:
      - "^develop$"
  path_instructions:
    - path: ".github/workflows/**"
      instructions: |
        - release.yml: архив essence-setup-<tag>.tar.gz обязан содержать все tracked-файлы из common/, setup-essence/, remote-control/ и VERSION — их требуют проверки `_need` в setup-essence/install-essence.sh и remote-control/install-remote-control.sh.
        - Job id `test` в tests.yml — обязательная проверка в rulesets protect-main и protect-develop; переименование блокирует мерж.
        - Минимальные permissions GITHUB_TOKEN; `contents: write` только у job публикации релиза.
        - Не подставлять `${{ }}`-выражения прямо в `run:`; передавать через `env:`.
    - path: "**/install-*.sh"
      instructions: |
        - Список `_need` должен соответствовать содержимому архива из .github/workflows/release.yml; новый обязательный файл — проверить, что release.yml его упаковывает.
    - path: "**/*.sh"
      instructions: |
        - Все entrypoints поддерживают Bash 3.2 (системный bash macOS): без mapfile/readarray, `declare -A`, `${var,,}`/`${var^^}`, `&>>`, `|&`, отрицательных индексов массивов.
