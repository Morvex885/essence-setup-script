name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Build release tarball
        run: |
          TARBALL="essence-setup-${VERSION}.tar.gz"

          # Собираем дистрибутив в отдельную папку
          mkdir -p dist/essence-setup/setup-essence/modules
          mkdir -p dist/essence-setup/remote-control/modules
          mkdir -p dist/essence-setup/remote-control/templates
          mkdir -p dist/essence-setup/common
          cp setup-essence/setup-essence.sh setup-essence/install-essence.sh dist/essence-setup/setup-essence/
          cp setup-essence/modules/*.sh dist/essence-setup/setup-essence/modules/
          cp remote-control/remote-control-essence.sh remote-control/install-remote-control.sh dist/essence-setup/remote-control/
          cp remote-control/modules/*.sh dist/essence-setup/remote-control/modules/
          cp remote-control/templates/*.yaml dist/essence-setup/remote-control/templates/
          cp -r common/. dist/essence-setup/common/
          cp VERSION dist/essence-setup/

          # Архивируем с корнем essence-setup/ → при распаковке --strip-components=1
          tar -czf "$TARBALL" -C dist essence-setup

          sha256sum "$TARBALL" > "${TARBALL}.sha256"

      - name: Verify release tarball
        run: |
          TARBALL="essence-setup-${VERSION}.tar.gz"
          listing=$(tar -tzf "$TARBALL")
          missing=0
          while IFS= read -r f; do
            if ! grep -qxF "essence-setup/$f" <<<"$listing"; then
              echo "::error::В архиве $TARBALL нет $f"
              missing=1
            fi
          done < <(git ls-files common setup-essence remote-control; echo VERSION)
          exit "$missing"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Essence ${{ github.ref_name }}"
          files: |
            essence-setup-${{ github.ref_name }}.tar.gz
            essence-setup-${{ github.ref_name }}.tar.gz.sha256
          generate_release_notes: true
          body: |
            ## Установка

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Morvex885/essence-setup-script/main/setup-essence/install-essence.sh | sudo bash
            ```

            ## Обновление
            Запустите `essence-setup` и выберите пункт **Обновить**.
            Или повторно выполните команду установки.
