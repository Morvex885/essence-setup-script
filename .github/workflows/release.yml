name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and verify release tarball
        run: bash tests/ci/build_release_tarball.sh "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Essence ${{ github.ref_name }}"
          files: |
            essence-setup-${{ github.ref_name }}.tar.gz
            essence-setup-${{ github.ref_name }}.tar.gz.sha256
          generate_release_notes: true
          body: |
            ## Установка

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Morvex885/essence-setup-script/main/setup-essence/install-essence.sh | sudo bash
            ```

            ## Обновление
            Запустите `essence-setup` и выберите пункт **Обновить**.
            Или повторно выполните команду установки.
