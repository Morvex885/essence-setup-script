name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl nginx curl

      - name: Run server unit tests
        run: ./tests/lib/bats-core/bin/bats tests/unit/ --recursive --tap

      - name: Run server fuzz tests
        run: FUZZ_ITERATIONS=50 ./tests/lib/bats-core/bin/bats tests/fuzz/ --recursive
        timeout-minutes: 10

  web-js-test:
    name: Web panel JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test web panel modules
        run: node --test remote-control/web/tests-js/*.test.mjs

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: remote-control
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Test workspace
        run: cargo test --workspace --locked

  rust-ssh-e2e:
    name: Rust OpenSSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Test against isolated OpenSSH
        run: bash tests/ci/ssh_e2e.sh

  # Rendered node configs against the real binaries: mihomo at the minimum
  # version profiles accept, nginx and its stream module from Ubuntu. Not a
  # required check.
  render-check:
    name: Rendered configs (mihomo -t, nginx -t)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIHOMO_ASSET: mihomo-linux-amd64-compatible-v1.19.18.gz
      MIHOMO_URL: https://github.com/MetaCubeX/mihomo/releases/download/v1.19.18/mihomo-linux-amd64-compatible-v1.19.18.gz
      MIHOMO_SHA256: f4bab249dabc7200db8408ca3af94ba5e8d68a62e13f22228dfc13d212cb4596
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Install nginx and mihomo
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx libnginx-mod-stream openssl
          curl -fsSL "$MIHOMO_URL" -o "$RUNNER_TEMP/$MIHOMO_ASSET"
          echo "$MIHOMO_SHA256  $RUNNER_TEMP/$MIHOMO_ASSET" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/$MIHOMO_ASSET" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v
      - name: Render representative nodes
        working-directory: remote-control
        run: ESSENCE_RENDER_DUMP="$RUNNER_TEMP/render" cargo test -p rc-core --lib --locked dump_representative_renders
      - name: Validate with mihomo -t and nginx -t
        run: sudo bash tests/ci/validate_render.sh "$RUNNER_TEMP/render" "$RUNNER_TEMP/mihomo"

  rust-build:
    name: Rust build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            msvc_arch: x64_arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: remote-control
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build workspace
        if: ${{ !matrix.cross }}
        # Runs under bash and pwsh (Windows); Cargo reads the target from the environment.
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --workspace --locked
      - name: Cross-build workspace
        if: matrix.cross
        # VERSION and the server assets live outside the Cargo workspace.
        working-directory: .
        env:
          TARGET: ${{ matrix.target }}
          # cross 0.2.5's Android image ships NDK r21 without libunwind, which
          # current Rust requires; the pinned main image has a newer NDK.
          CROSS_TARGET_AARCH64_LINUX_ANDROID_IMAGE: ghcr.io/cross-rs/aarch64-linux-android@sha256:b081e122d075268e8f528b914ae0b2d0c6dc4dc4921ab05da86cc44726f4e2a0
        run: cross build --manifest-path remote-control/Cargo.toml --workspace --locked --target "$TARGET"
