name: Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  rust-test:
    name: Rust tests probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: remote-control
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
